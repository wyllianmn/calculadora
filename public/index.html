<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculadora">
    <div class="visor" aria-live="polite">
      <div id="expressao" class="expressao">&nbsp;</div>
      <div id="resultado" class="resultado">0</div>
    </div>

    <div class="teclas">
      <button class="tecla funcao" data-acao="limpar">C</button>
      <button class="tecla funcao" data-valor="(">(</button>
      <button class="tecla funcao" data-valor=")">)</button>
      <button class="tecla operador" data-valor="/">÷</button>

      <button class="tecla" data-valor="7">7</button>
      <button class="tecla" data-valor="8">8</button>
      <button class="tecla" data-valor="9">9</button>
      <button class="tecla operador" data-valor="*">×</button>

      <button class="tecla" data-valor="4">4</button>
      <button class="tecla" data-valor="5">5</button>
      <button class="tecla" data-valor="6">6</button>
      <button class="tecla operador" data-valor="-">−</button>

      <button class="tecla" data-valor="1">1</button>
      <button class="tecla" data-valor="2">2</button>
      <button class="tecla" data-valor="3">3</button>
      <button class="tecla operador" data-valor="+">+</button>

      <button class="tecla" data-valor="0">0</button>
      <button class="tecla" data-valor=".">,</button>
      <button class="tecla funcao" data-acao="apagar">⌫</button>
      <button class="tecla igual" data-acao="calcular">=</button>
    </div>

    <section class="historico" id="historico" hidden>
      <h2>Histórico</h2>
      <ul id="lista-historico"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
